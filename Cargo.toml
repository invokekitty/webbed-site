[package]
name = "seergysite2"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4.15.0", features = [ "rustls-0_23" ] }
actix-web-static-files = { version = "4.1.1", features = ["static-files-03"] }
clap = { version = "4.6.7", features = ["derive"] }
grass = { version = "0.13.4", default-features = false, features = [ "macro" ]}
maud = { version = "0.27.0", features = [ "actix-web" ] }
rustls = "0.23.45"
static-files = "0.3.1"

[build-dependencies]
static-files = "0.3.1"
