[package]
name = "seergysite"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = "thin"
strip = true

[dependencies]
actix-web = { version = "4.15.0", features = [ "rustls-0_23" ] }
actix-web-static-files = { version = "4.1.1", features = ["static-files-03"] }
actix-web-httpauth = "0.8.3"
cached = { version = "4.0.3", features = ["async"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
grass = { version = "0.13.4", default-features = false, features = [ "macro" ]}
iana-time-zone = "0.1.65"
markdown = "1.0.0"
maud = { git = "https://github.com/invokekitty/maudx", features = [ "actix-web", "json", "components", "default-fields" ] }
rustls = "0.23.45"
static-files = "0.3.1"
sqlx = { version = "0.9.0", features = [ "sqlite", "runtime-tokio", "chrono" ]}
brotli = "9.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
actix-governor = "0.10.0"
ring = { version = "0.17.14", features = ["std"] }
# serenity = "0.12.5"

[build-dependencies]
static-files = "0.3.1"
